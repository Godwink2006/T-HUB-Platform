<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Timetable - High School Management System</title>
    <link rel="stylesheet" href="/css/my-timetable.css" />

    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="timetable-container">
      <header class="timetable-header">
        <div class="header-titles">
          <div class="topbar">
            <h1 id="timetableTitle">My Timetable</h1>
            <p id="timetableSubtitle" class="text-muted"></p>
          </div>

          <button
            onclick="window.location.href = 'academics.html'"
            class="back-academic-settings-btn"
          >
            <i class="fa-solid fa-chevron-left"></i>
            Back
          </button>
        </div>
      </header>

      <div class="topbar-filters">
        <div>
          <select id="filterTimetableDays" class="form-control">
            <option value="">All Days</option>
          </select>
        </div>
      </div>

      <div id="classMetaBanner" class="card meta-banner hidden">
        <div class="meta-item">
          <i class="fa-solid fa-graduation-cap"></i>
          <div>
            <span class="meta-label">Class</span>
            <strong id="classNameDisplay">--</strong>
          </div>
        </div>
        <div class="meta-item">
          <i class="fa-solid fa-user-tie"></i>
          <div>
            <span class="meta-label">Class Teacher</span>
            <strong id="classTeacherDisplay">--</strong>
          </div>
        </div>
      </div>

      <main class="timetable-cards-grid" id="timetableCardsGrid">
        <div class="loading-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p>Loading schedule cards...</p>
        </div>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/my-timetable.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
