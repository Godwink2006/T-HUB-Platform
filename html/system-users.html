<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/system-users.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="systemUser-container">
      <main class="systemUser-main-content">
        <header class="topbar">
          <div>
            <h1>System Users</h1>
            <p>Manage Users.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-systemUsers-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addSystemUser" class="add-systemUsers-btn">
            <i class="fa-solid fa-plus"></i>
            Add User
          </button>
        </header>

        <section class="toolbar">
          <input type="text" id="searchInput" placeholder="Search users..." />

          <select id="roleFilter">
            <option value="">Role</option>
            <option value="Librarian">Librarian</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Accountant">Accountant</option>
          </select>

          <select id="statusFilter">
            <option value="">Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </section>

        <section class="systemUsers-table-card">
          <table id="usersTable">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="systemUserModal" class="modal-systemUser">
      <div class="systemUser-modal-content">
        <div class="systemUser-modal-header">
          <h2>Add User</h2>

          <button id="closeSystemUserModal">&times;</button>
        </div>

        <div class="systemUser-modal-body">
          <form id="systemUserForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name *</label>

                <input
                  id="fullName"
                  name="full_name"
                  type="text"
                  placeholder="Must be at least 2 to 4 words"
                  required
                />
              </div>

              <div class="form-group">
                <label>Email Address *</label>

                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="example@gmail.com"
                  required
                />
              </div>

              <div class="form-group">
                <label>Phone Number *</label>

                <input
                  id="phoneNumber"
                  name="phone_number"
                  type="tel"
                  placeholder="077 or 088"
                  required
                />
              </div>

              <div class="form-group">
                <label>Role *</label>

                <select id="role" name="role" required>
                  <option value="librarian">librarian</option>
                  <option value="receptionist">receptionist</option>
                  <option value="accountant">accountant</option>
                </select>
              </div>

              <div class="form-group">
                <label for="newPassword">Password *</label>

                <div class="password-field">
                  <input
                    type="password"
                    id="newPassword"
                    placeholder="Must be 12 characters or more with uppercase, lowercase, and special characters"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('newPassword', this)"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>

                <div class="password-field">
                  <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Must match the password above"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="avatar-upload-group">
                <label class="form-label">Profile photo (Optional)</label>
                <div class="avatar-edit-container">
                  <div class="avatar-preview-wrapper">
                    <img
                      id="addAvatarPreview"
                      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                      alt="Profile Preview"
                      onerror="
                        this.onerror = null;
                        this.src =
                          'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                      "
                    />
                  </div>

                  <div class="avatar-upload-actions">
                    <label
                      for="addAvatarInput"
                      class="btn-secondary upload-btn"
                    >
                      <i class="bx bx-upload"></i> Add Photo
                    </label>
                    <input
                      type="file"
                      id="addAvatarInput"
                      accept="image/*"
                      hidden
                    />
                    <span id="addFileNameDisplay" class="file-name-text"
                      >No new file chosen</span
                    >
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="status" name="status">
                  <option>Active</option>
                  <option>Inactive</option>
                </select>
              </div>
            </div>

            <div class="systemUser-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelSystemUserModal"
              >
                Cancel
              </button>

              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="editSystemUserModal" class="edit-modal-systemUser">
      <div class="edit-systemUser-modal-content">
        <div class="edit-systemUser-modal-header">
          <h2>Edit User</h2>

          <button id="closeEditSystemUserModal">&times;</button>
        </div>

        <div class="edit-systemUser-modal-body">
          <form id="editSystemUserForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name *</label>

                <input
                  id="editFullName"
                  type="text"
                  placeholder="Enter full name"
                />
              </div>

              <div class="form-group">
                <label>Phone Number *</label>

                <input
                  id="editPhone"
                  type="number"
                  placeholder="Enter phone number"
                />
              </div>

              <div class="avatar-upload-group">
                <label class="form-label">Profile Picture (Optional)</label>
                <div class="avatar-edit-container">
                  <div class="avatar-preview-wrapper">
                    <img
                      id="editAvatarPreview"
                      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                      alt="Profile Preview"
                      onerror="
                        this.onerror = null;
                        this.src =
                          'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                      "
                    />
                  </div>

                  <div class="avatar-upload-actions">
                    <label
                      for="editAvatarInput"
                      class="btn-secondary upload-btn"
                    >
                      <i class="bx bx-upload"></i> Change Photo
                    </label>
                    <input
                      type="file"
                      id="editAvatarInput"
                      accept="image/*"
                      hidden
                    />
                    <span id="fileNameDisplay" class="file-name-text"
                      >No new file chosen</span
                    >
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="editStatus" name="status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="edit-systemUser-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditSystemUserModal"
              >
                Cancel
              </button>

              <button type="button" id="updateSystemUserBtn" class="edit-btn">
                Update User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/system-users.js"></script>
  </body>
</html>
