<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/system-users.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="systemUser-container">
      <main class="systemUser-main-content">
        <header class="topbar">
          <div>
            <h1>System Users</h1>
            <p>Manage Users.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-systemUsers-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addSystemUser" class="add-systemUsers-btn">
            <i class="fa-solid fa-plus"></i>
            Add User
          </button>
        </header>

        <section class="toolbar">
          <input type="text" placeholder="Search users..." />

          <select>
            <option>Role</option>
            <option>Admin</option>
            <option>Librarian</option>
            <option>Receptionist</option>
            <option>Accountant</option>
          </select>

          <select>
            <option>Status</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </section>

        <section class="systemUsers-table-card">
          <table id="usersTable">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                  <span class="systemUsers-status active">Active</span>
                </td>

                <td>
                  <button class="systemUsers-actions-btn edit-SystemUser">
                    <i class="fa-solid fa-pen"></i>
                  </button>

                  <button class="systemUsers-actions-btn archive-SystemUser">
                    <i class="fa-solid fa-box-archive"></i>
                  </button>
                </td>
              </tr>

              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                  <span class="systemUsers-status-inactive"></span>
                </td>

                <td></td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="systemUserModal" class="modal-systemUser">
      <div class="systemUser-modal-content">
        <div class="systemUser-modal-header">
          <h2>Add User</h2>

          <button id="closeSystemUserModal">&times;</button>
        </div>

        <div class="systemUser-modal-body">
          <form id="systemUserForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name *</label>

                <input
                  id="fullName"
                  name="full_name"
                  type="text"
                  placeholder="Must be at least 2 to 4 words"
                  required
                />
              </div>

              <div class="form-group">
                <label>Email Address *</label>

                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="example@school.com"
                  required
                />
              </div>

              <div class="form-group">
                <label>Phone Number *</label>

                <input
                  id="phoneNumber"
                  name="phone_number"
                  type="tel"
                  placeholder="077 or 088"
                  required
                />
              </div>

              <div class="form-group">
                <label>Role *</label>

                <select id="role" name="role" required>
                  <option value="librarian">librarian</option>
                  <option value="receptionist">receptionist</option>
                  <option value="accountant">accountant</option>
                </select>
              </div>

              <div class="form-group">
                <label for="newPassword">Password *</label>

                <div class="password-field">
                  <input
                    type="password"
                    id="newPassword"
                    placeholder="Must be 12 characters or more with uppercase, lowercase, and special characters"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('newPassword', this)"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>

                <div class="password-field">
                  <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Must match the password above"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label>Profile photo (Optional)</label>

                <input
                  id="photo"
                  name="photo_url"
                  type="file"
                  accept="image/*"
                />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="status" name="status">
                  <option>Active</option>
                  <option>Inactive</option>
                </select>
              </div>
            </div>

            <div class="systemUser-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelSystemUserModal"
              >
                Cancel
              </button>

              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!---Edit class modal-->

    <div id="editSystemUserModal" class="edit-modal-systemUser">
      <div class="edit-systemUser-modal-content">
        <div class="edit-systemUser-modal-header">
          <h2>Edit User</h2>

          <button id="closeEditSystemUserModal">&times;</button>
        </div>

        <div class="edit-systemUser-modal-body">
          <form id="editSystemUserForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name *</label>

                <input type="text" placeholder="Enter full name" />
              </div>

              <div class="form-group">
                <label>Email Address *</label>

                <input type="text" placeholder="Enter email address" />
              </div>

              <div class="form-group">
                <label>Phone Number *</label>

                <input type="number" placeholder="Enter phone number" />
              </div>

              <div class="form-group">
                <label>Role *</label>
                <select>
                  <option>Admin</option>
                  <option>Librarian</option>
                  <option>Receptionist</option>
                  <option>Accountant</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select>
                  <option>Active</option>
                  <option>Archive</option>
                </select>
              </div>
            </div>

            <div class="edit-systemUser-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditSystemUserModal"
              >
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update User</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveSystemUserModal" class="archive-modal">
      <div class="confirm-modal">
        <div confirm-icon>
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive User</h2>

        <p>
          Are you sure you want to archive this User? The user will no longer be
          able to access the system.
        </p>

        <div class="archive-modal-footer">
          <button id="cancelArchive" class="cancel-btn">Cancel</button>

          <button id="confirmArchive" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/system-users.js"></script>
  </body>
</html>
