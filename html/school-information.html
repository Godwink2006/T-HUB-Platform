<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/school-informations.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <section class="settings-page" id="schoolInformationPage">
      <div class="page-header">
        <h2>School Information</h2>
        <p>view or manage your school's general information and identity.</p>
      </div>

      <button
        onclick="window.location.href = 'settings.html'"
        class="back-school-informations-btn"
      >
        <i class="fa-solid fa-chevron-left"></i>
        Back
      </button>

      <div id="formLoader" class="form-loader">
        <div class="spinner"></div>
        <p>Loading........</p>
      </div>

      <form id="schoolInformationForm" class="settings-form">
        <div class="form-section">
          <h3>School Logo</h3>

          <div class="avatar-upload-group">
            <div class="avatar-edit-container">
              <div class="my-profile-upload">
                <img
                  id="schoolLogoPreview"
                  src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                  alt="Profile Picture"
                  style="
                    width: 150px;
                    height: 150px;
                    border-radius: 50%;
                    object-fit: cover;
                    display: block;
                  "
                  onerror="
                    this.onerror = null;
                    this.src =
                      'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                  "
                />

                <div id="changeSchoolLogo" class="avatar-upload-actions">
                  <label for="schoolLogo" class="btn-secondary upload-btn">
                    <i class="bx bx-upload"></i> Change Logo
                  </label>

                  <input type="file" id="schoolLogo" accept="image/*" hidden />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>General Information</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="schoolName">School Name</label>

              <textarea
                type="text"
                id="schoolName"
                placeholder="School Name"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="schoolMotto">School Motto</label>

              <textarea
                type="text"
                id="schoolMotto"
                placeholder="School Motto"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="schoolEmail">Email</label>

              <textarea
                type="email"
                id="schoolEmail"
                placeholder="School Email"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="alternativePhone">Alternative Phone</label>

              <input
                type="tel"
                id="alternativePhone"
                placeholder="Phone Number"
              />
            </div>

            <div class="form-group">
              <label for="schoolWebsite">Website</label>

              <textarea
                type="url"
                id="schoolWebsite"
                placeholder="https://example.com"
              ></textarea>
            </div>

            <div class="form-group full-width">
              <label for="schoolAddress">Address</label>

              <textarea
                rows="3"
                id="schoolAddress"
                placeholder="school address"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label for="schoolCity">City</label>

              <input type="text" id="schoolCity" placeholder="city" required />
            </div>

            <div class="form-group">
              <label for="schoolCountry">Country</label>

              <input
                type="text"
                id="schoolCountry"
                placeholder="country"
                required
              />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>Principal / Head Teacher</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="principalName">Full Name</label>
              <textarea
                type="text"
                id="principalName"
                placeholder="Principal's name"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="principalEmail">Email</label>
              <textarea
                type="email"
                id="principalEmail"
                placeholder="Principal's email"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="principalPhone">Phone Number</label>
              <input
                type="tel"
                id="principalPhone"
                placeholder="Principal's phone"
              />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>School Details</h3>

          <div class="form-grid">
            <div class="form-group">
              <label for="schoolType">School type</label>
              <select id="schoolType" required>
                <option>School Type</option>
                <option>Public</option>
                <option>Private</option>
                <option>International</option>
              </select>
            </div>

            <div class="form-group">
              <label for="educationLevel">Education Level</label>
              <select id="educationLevel" required>
                <option>School Level</option>
                <option>Nursery</option>
                <option>Primary</option>
                <option>Junior Secondary</option>
                <option>Senior Secondary</option>
                <option>Primary & Secondary</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" class="cancel-btn">Reset</button>

          <button type="submit" class="save-btn">Save Changes</button>
        </div>
      </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/school-information.js"></script>
  </body>
</html>
