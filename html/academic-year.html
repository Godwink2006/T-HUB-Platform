<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/academic-settings.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="academic-settings-container">
      <main class="academic-settings-main-content">
        <header class="topbar">
          <div>
            <h2>Academic Years.</h2>
            <button
              onclick="window.location.href = 'settings.html'"
              class="back-academic-settings-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addAcademicYear" class="add-academic-years-btn">
            <i class="fa-solid fa-plus"></i>
            Add Academic Year
          </button>
        </header>

        <section class="academic-years-table-card">
          <table>
            <thead>
              <tr>
                <th>Academic Year</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="academicYearModal" class="modal-academic-year">
      <div class="academic-year-modal-content">
        <div class="academic-year-modal-header">
          <h2>Add Academic Year</h2>

          <button id="closeAcademicYearModal">&times;</button>
        </div>

        <div class="academic-year-modal-body">
          <form id="academicYearForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>
                <select id="addYearSelect" name="year_label" required>
                  <option value="">Select Year</option>
                  <option value="2028/2029">2028/2029</option>
                  <option value="2027/2028">2027/2028</option>
                  <option value="2026/2027">2026/2027</option>
                  <option value="2025/2026">2025/2026</option>
                  <option value="2024/2025">2024/2025</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status *</label>
                <select id="addStatusSelect" name="status" required>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="academic-year-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelAcademicYearModal"
              >
                Cancel
              </button>

              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="editAcademicYearModal" class="edit-modal-academic-year">
      <div class="edit-academic-year-modal-content">
        <div class="edit-academic-year-modal-header">
          <h2>Edit Academic Year</h2>

          <button id="closeEditAcademicYearModal">&times;</button>
        </div>

        <div class="edit-academic-year-modal-body">
          <form id="editAcademicYearForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>
                <select id="editYearSelect" name="year_label" required>
                  <option value="2027/2028">2027/2028</option>
                  <option value="2026/2027">2026/2027</option>
                  <option value="2025/2026">2025/2026</option>
                  <option value="2024/2025">2024/2025</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status *</label>
                <select id="editStatusSelect" name="status" required>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="edit-academic-year-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditAcademicYearModal"
              >
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/academic-year.js"></script>
  </body>
</html>
