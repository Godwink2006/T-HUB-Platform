<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>High School Management System</title>
    <link rel="stylesheet" href="/css/library-reports.css">
    <link rel="preconnect" href="https://fontsgoogleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="librarys-report-container">

<main class="librarys-report-main-content">
<header class="topbar">
    <div>
        <h1>Library Reports</h1>
        <p>View library reports.</p>

         <button onclick="window.location.href='reports.html'"   class="back-librarys-report-btn">
        <i class="fa-solid fa-chevron-left"></i>
        Back
    </button>
    </div>

</header>

<section class="toolbar">

   <select>
        <option>Status</option>
    </select>

    </section>

<section class="librarys-report-table-card">
   <table>
    <thead>
        <tr>
            <th>Total Books</th>
             <th>Borrowed Books</th>
              <th>Returned Books</th>
              <th>Overdue Books</th>
              <th>Lost Books</th>
              <th>Available Books</th>
              <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>70</td>
            <td>12</td>
            <td>50</td>
            <td>2</td>
            <td>1</td>
            <td>23</td>

             <td>
                <button class="librarys-report-actions-btn save-btn">
                    Print Report
                </button>

               <button class="librarys-report-actions-btn save-btn">
                    Export PDF
                </button>

                 <button class="librarys-report-actions-btn save-btn">
                    Export Excel
                </button>

            </td>
        </tr>


    </tbody>
   </table>
</section>
</main>

    </div>


<script src="/js/utils.js"></script>
</body>
</html>
