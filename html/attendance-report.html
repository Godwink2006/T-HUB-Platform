<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/attendance-report.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="attendances-report-container">
      <main class="attendances-report-main-content">
        <header class="topbar">
          <div>
            <h1>Attendance Reports</h1>
            <p>View attendance reports.</p>

            <button
              onclick="window.location.href = 'reports.html'"
              class="back-attendances-report-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>
        </header>

        <section class="toolbar">
          <select>
            <option>Date</option>
            <option>August</option>
            <option>May</option>
          </select>

          <select>
            <option>Class</option>
            <option>Grade 8A</option>
            <option>Grade 3B</option>
          </select>

          <select>
            <option>Term</option>
            <option>Term 1</option>
            <option>Term 2</option>
          </select>

          <select>
            <option>Academic Year</option>
            <option>2026-2027</option>
            <option>2025-2026</option>
            <option>2024-2025</option>
          </select>
        </section>

        <section class="attendances-report-table-card">
          <table>
            <thead>
              <tr>
                <th>Attendance Records</th>
                <th>Present</th>
                <th>Absent</th>
                <th>Attendance Rate</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Good</td>
                <td>96%</td>
                <td>6%</td>
                <td>99%</td>

                <td>
                  <button class="attendances-report-actions-btn save-btn">
                    Print Report
                  </button>

                  <button class="attendances-report-actions-btn save-btn">
                    Export PDF
                  </button>

                  <button class="attendances-report-actions-btn save-btn">
                    Export Excel
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="/js/utils.js"></script>
  </body>
</html>
