<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set Your Password | T-HUB</title>
    <link rel="stylesheet" href="/css/parent-portal.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>
  <body class="parent-portal">
    <header class="parent-topbar"><a class="parent-brand" href="/index.html"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>T-HUB <small>Family Portal</small></span></a></header>
    <main class="parent-main parent-form-main">
      <section class="parent-welcome"><p class="parent-eyebrow">Finish account setup</p><h1>Set your password</h1><p>Choose a password to sign in to the parent portal.</p></section>
      <form id="parentPasswordForm" class="parent-form" novalidate>
        <label for="parentNewPassword">New password</label>
        <input id="parentNewPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="parentConfirmPassword">Confirm password</label>
        <input id="parentConfirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
        <div id="parentPasswordMessage" class="parent-form-message" role="status" aria-live="polite"></div>
        <button id="saveParentPassword" class="parent-primary-button" type="submit">Save password</button>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/parent-set-password.js"></script>
  </body>
</html>
