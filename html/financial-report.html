<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/financial-report.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="financials-record-container">
      <main class="financials-record-main-content">
        <header class="topbar">
          <div>
            <h1>Financials</h1>
            <p>View financial reports.</p>

            <button
              onclick="window.location.href = 'reports.html'"
              class="back-financials-record-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>
        </header>

        <section class="toolbar">
          <select>
            <option>Term</option>
            <option>Term 1</option>
          </select>

          <select>
            <option>Class</option>
            <option>Grade 7B</option>
          </select>

          <select>
            <option>Academic Year</option>
            <option>2026-2027</option>
            <option>2025-2026</option>
            <option>2024-2025</option>
          </select>
        </section>

        <section class="financials-record-table-card">
          <table>
            <thead>
              <tr>
                <th>Expected Revenue</th>
                <th>Collected Revenue</th>
                <th>Outstanding Balance</th>
                <th>Paid Students</th>
                <th>Partial Payments</th>
                <th>Unpaid Students</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>RWF 250,000,000</td>
                <td>RWF 180,000,000</td>
                <td>RWF 70,000,000</td>
                <td>RWF 320</td>
                <td>RWF 100</td>
                <td>RWF 80</td>

                <td>
                  <button class="financials-record-actions-btn save-btn">
                    Print Report
                  </button>

                  <button class="financials-record-actions-btn save-btn">
                    Export PDF
                  </button>

                  <button class="financials-record-actions-btn save-btn">
                    Export Excel
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/financial-report.js"></script>
  </body>
</html>
