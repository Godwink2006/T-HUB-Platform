<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Schedule - School Management System</title>
    <link rel="stylesheet" href="/css/my-assignments.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="content-container">
      <div class="page-header">
        <div>
          <h2>My Teaching Schedule</h2>
          <p>Overview of your assigned classes, subjects, and roles.</p>
        </div>

        <button
          onclick="window.location.href = 'academics.html'"
          class="back-academic-settings-btn"
        >
          <i class="fa-solid fa-chevron-left"></i>
          Back
        </button>
      </div>

      <div
        class="filters-bar"
        style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap"
      >
        <div style="flex: 1; min-width: 200px">
          <input
            type="text"
            id="teacherSearchInput"
            class="form-control"
            placeholder="Search schedule..."
          />
        </div>

        <div style="min-width: 160px">
          <select id="filterAcademicYear" class="form-control">
            <option value="">All Academic Years</option>
          </select>
        </div>

        <div style="min-width: 160px">
          <select id="filterSubject" class="form-control">
            <option value="">All Subjects</option>
          </select>
        </div>

        <div style="min-width: 160px">
          <select id="filterClass" class="form-control">
            <option value="">All Classes</option>
          </select>
        </div>
      </div>

      <div class="assignments-grid" id="assignmentsGrid"></div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/my-assignments.js"></script>
  </body>
</html>
