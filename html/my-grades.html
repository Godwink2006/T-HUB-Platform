<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/my-grades.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <h1>My Grades</h1>
        <p>View your academic performance and breakdown.</p>

        <button
          onclick="window.location.href = 'academics.html'"
          class="back-grades-btn"
        >
          <i class="fa-solid fa-chevron-left"></i>
          Back
        </button>
      </header>

      <!-- Student Toolbar Filters -->
      <section
        class="toolbar"
        style="
          background-color: #ffffff;
          padding: 12px;
          border: 2px solid rgb(219, 215, 215);
          margin-bottom: 24px;
        "
      >
        <!-- Row 1: Academic Year & Semester -->
        <div style="display: flex; gap: 8px; margin-bottom: 8px">
          <select
            id="studentAcademicYearSelect"
            style="
              flex: 0 0 calc(50% - 4px);
              width: calc(50% - 4px);
              box-sizing: border-box;
              padding: 8px 6px;
              font-size: 0.75rem;
              cursor: pointer;
              border: 2px solid rgb(219, 215, 215);
            "
          >
            <option value="">Select Academic Year</option>
          </select>
          <select
            id="studentTermSelect"
            style="
              flex: 0 0 calc(50% - 4px);
              width: calc(50% - 4px);
              box-sizing: border-box;
              padding: 8px 6px;
              font-size: 0.75rem;
              cursor: pointer;
              border: 2px solid rgb(219, 215, 215);
            "
          >
            <option value="">Select Semester</option>
          </select>
        </div>

        <!-- Row 2: Assessment & Class -->
        <div style="display: flex; gap: 8px; margin-bottom: 8px">
          <select
            id="studentAssessmentSelect"
            style="
              flex: 0 0 calc(50% - 4px);
              width: calc(50% - 4px);
              box-sizing: border-box;
              padding: 8px 6px;
              font-size: 0.75rem;
              cursor: pointer;
              border: 2px solid rgb(219, 215, 215);
            "
          >
            <option value="">Select Assessment</option>
          </select>
          <select
            id="studentClassSelect"
            style="
              flex: 0 0 calc(50% - 4px);
              width: calc(50% - 4px);
              box-sizing: border-box;
              padding: 8px 6px;
              font-size: 0.75rem;
              cursor: pointer;
              border: 2px solid rgb(219, 215, 215);
            "
          >
            <option value="">Select Class</option>
          </select>
        </div>

        <!-- Row 3: Subject & Status Display (Strictly 2 on one line, neatly contained) -->
        <div style="display: flex; gap: 6px; align-items: center; width: 100%">
          <select
            id="studentSubjectSelect"
            style="
              flex: 0 0 calc(50% - 3px);
              width: calc(50% - 3px);
              box-sizing: border-box;
              padding: 6px 4px;
              font-size: 0.7rem;
              cursor: pointer;
              border: 2px solid rgb(219, 215, 215);
            "
          >
            <option value="">Select Subject</option>
          </select>
          <div
            class="status-display"
            style="
              flex: 0 0 calc(50% - 3px);
              width: calc(30% - 1px);
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 500;
              font-size: 0.7rem;
              padding: 5px 2px;
              background: #f8fafc;
              border: 2px solid rgb(219, 215, 215);
              box-sizing: border-box;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            "
          >
            Status: &nbsp;<span
              id="studentStatusBadge"
              class="status-badge normal"
              >...</span
            >
          </div>
        </div>
      </section>

      <!-- Student Grades Summary Table / Report View -->
      <div class="grades-container">
        <div id="studentGradesReport">
          <p style="text-align: center; color: #888; padding: 20px">
            Select a semester to view your grades.
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/my-grades.js"></script>
  </body>
</html>
