<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/notifications.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar (Keep your standard sidebar here) -->

      <main class="main-content notifications-page">
        <div class="notifications-header">
          <div>
            <h1 class="page-title">Notifications</h1>
            <p class="page-subtitle">Manage your school alerts and updates</p>

            <button
              onclick="window.location.href = 'dashboard.html'"
              class="back-my-profiles-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>
          <button id="markAllReadBtn" class="btn-primary-action">
            Mark all as read
          </button>
        </div>

        <!-- Filter Tabs -->
        <div class="notif-tabs-container">
          <button class="notif-tab active" data-filter="all">All</button>
          <button class="notif-tab" data-filter="unread">Unread</button>
          <button class="notif-tab" data-filter="read">Read</button>
        </div>

        <!-- Notifications Container List -->
        <div id="fullNotificationList" class="notifications-card-list">
          <div class="notifications-loading-state">
            <i class="fas fa-spinner fa-spin" style="color: grey"></i>
            Loading notifications...
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/notifications.js"></script>
  </body>
</html>
