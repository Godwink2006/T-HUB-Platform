<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/teacher-assignment.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="assigns-container">
      <main class="assigns-main-content">
        <header class="topbar">
          <div>
            <h1>Teacher Assignments</h1>
            <p>Manage teacher assignment.</p>

            <button
              onclick="window.location.href = 'academics.html'"
              class="back-academics-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addAssign" class="add-assigns-btn">
            <i class="fa-solid fa-plus"></i>
            Assign
          </button>
        </header>

        <section class="toolbar">
          <input
            type="text"
            id="assignSearchInput"
            placeholder="Search assignments..."
          />

          <select id="filterTeacher">
            <option value="">All Teachers</option>
          </select>

          <select id="filterClass">
            <option value="">All Classes</option>
          </select>

          <select id="filterAcademicYear">
            <option value="">All Academic Years</option>
          </select>

          <select id="filterStatus">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </section>

        <section class="assigns-table-card">
          <table>
            <thead>
              <tr>
                <th>Teacher</th>
                <th>Subject</th>
                <th>Class</th>
                <th>Academic Year</th>
                <th>Class Teacher</th>
                <th>Description</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="assignmentsTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="assignModal" class="modal-assign" style="display: none">
      <div class="assign-modal-content">
        <div class="assign-modal-header">
          <h2>Assign Teacher</h2>
          <button id="closeAssignModal" type="button">&times;</button>
        </div>

        <div class="assign-modal-body">
          <form id="assignForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="assignTeacherId">Teacher *</label>
                <select id="assignTeacherId" name="teacher_id" required>
                  <option value="">Select Teacher</option>
                </select>
              </div>

              <div class="form-group">
                <label for="assignSubjectId">Subject *</label>
                <select id="assignSubjectId" name="subject_id" required>
                  <option value="">Select Subject</option>
                </select>
              </div>

              <div class="form-group">
                <label for="assignClassId">Class *</label>
                <select id="assignClassId" name="class_id" required>
                  <option value="">Select Class</option>
                </select>
              </div>

              <div class="form-group">
                <label for="assignAcademicYearId">Academic Year *</label>
                <select
                  id="assignAcademicYearId"
                  name="academic_year_id"
                  required
                >
                  <option value="">Select Academic Year</option>
                </select>
              </div>

              <div class="form-group">
                <label for="assignIsClassTeacher">Class Teacher *</label>
                <select
                  id="assignIsClassTeacher"
                  name="is_class_teacher"
                  required
                >
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>

              <div class="form-group">
                <label for="assignStatus">Status *</label>
                <select id="assignStatus" name="status" required>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="assignDescription">Description (Optional)</label>
                <textarea
                  id="assignDescription"
                  name="description"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="assign-modal-footer">
              <button type="button" class="cancel-btn" id="cancelAssignModal">
                Cancel
              </button>
              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="editAssignModal" class="edit-modal-assign" style="display: none">
      <div class="edit-assign-modal-content">
        <div class="edit-assign-modal-header">
          <h2>Edit Assign Teacher</h2>
          <button id="closeEditAssignModal" type="button">&times;</button>
        </div>

        <div class="edit-assign-modal-body">
          <form id="editAssignForm">
            <input type="hidden" id="editAssignmentId" />

            <div class="form-grid">
              <div class="form-group">
                <label for="editIsClassTeacher">Class Teacher *</label>
                <select
                  id="editIsClassTeacher"
                  name="is_class_teacher"
                  required
                >
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>

              <div class="form-group">
                <label for="editStatus">Status *</label>
                <select id="editStatus" name="status" required>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="editDescription">Description (Optional)</label>
                <textarea
                  id="editDescription"
                  name="description"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="edit-assign-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditAssignModal"
              >
                Cancel
              </button>
              <button type="submit" class="edit-btn" id="updateAssignBtn">
                Update
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/teacher-assignment.js"></script>
  </body>
</html>
