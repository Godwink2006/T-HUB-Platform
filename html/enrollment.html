<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/enrollment.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="table-container">
      <table class="student-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" /></th>
            <th>Student Name</th>
            <th>Class</th>
            <th>Academic Year</th>
            <th>Term</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- Real data will load here dynamically -->
        </tbody>
      </table>
    </div>

    <div id="bulkActionBar" class="bulk-action-bar">
      <span id="selectedCount">0 students selected</span>
      <button id="btnChangeStatus" class="btn-secondary">Change Status</button>
      <button id="btnSemesterMove" class="btn-primary">
        Move to 2nd Semester
      </button>
      <button id="btnPromote" class="btn-primary">Promote Students</button>
    </div>

    <!-- Modal for Inputs -->
    <div id="actionModal" class="modal-overlay">
      <div class="modal-content">
        <h3 id="modalTitle">Action Title</h3>
        <div id="modalBody" style="margin-top: 12px">
          <!-- Dynamic inputs get injected here via JS -->
        </div>
        <div
          style="
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
          "
        >
          <button id="modalCancel" type="button" class="btn-secondary">
            Cancel
          </button>
          <button id="modalConfirm" type="button" class="btn-primary">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/enrollment.js"></script>
  </body>
</html>
