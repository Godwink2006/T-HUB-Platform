<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/department.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="department-container">
      <main class="department-main-content">
        <header class="topbar">
          <div>
            <h1>Departments</h1>
            <p>Manage Departments.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-departments-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addDepartment" class="add-departments-btn">
            <i class="fa-solid fa-plus"></i>
            Add Department
          </button>
        </header>

        <section class="departments-table-card">
          <table>
            <thead>
              <tr>
                <th>Department Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="departmentsTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="departmentModal" class="modal-department">
      <div class="department-modal-content">
        <div class="department-modal-header">
          <h2>Add Department</h2>

          <button id="closeDepartmentModal">&times;</button>
        </div>

        <div class="department-modal-body">
          <form id="departmentForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Department Name *</label>

                <input
                  id="departmentName"
                  type="text"
                  placeholder="Enter department name"
                />
              </div>

              <div class="form-group">
                <label>Description (Optional)</label>

                <input
                  id="departmentDescription"
                  type="text"
                  placeholder="Optional"
                />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="departmentStatus">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="department-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelDepartmentModal"
              >
                Cancel
              </button>

              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!---Edit department modal-->

    <div id="editDepartmentModal" class="edit-modal-department">
      <div class="edit-department-modal-content">
        <div class="edit-department-modal-header">
          <h2>Edit Department</h2>

          <button id="closeEditDepartmentModal">&times;</button>
        </div>

        <div class="edit-department-modal-body">
          <form id="editDepartmentForm">
            <!-- Add this hidden field -->
            <input type="hidden" id="editDepartmentId" />
            <div class="form-grid">
              <div class="form-group">
                <label>Department Name *</label>

                <input
                  id="editDepartmentName"
                  type="text"
                  placeholder="Enter department name"
                />
              </div>

              <div class="form-group">
                <label>Description (Optional)</label>

                <input
                  id="editDescription"
                  type="text"
                  placeholder="Optional"
                />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="editStatus">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="edit-department-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditDepartmentModal"
              >
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveDepartmentModal" class="archive-modal">
      <div class="confirm-modal">
        <div class="confirm-icon">
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Department</h2>

        <p>
          Are you sure you want to archive
          <span
            id="archiveDepartmentName"
            style="font-weight: 600; color: green"
            >this Department</span
          >? Archived departments cannot be assigned to new teachers or
          subjects.
        </p>

        <div class="archive-modal-footer">
          <button id="cancelArchive" class="cancel-btn">Cancel</button>

          <button id="confirmArchive" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/department.js"></script>
  </body>
</html>
