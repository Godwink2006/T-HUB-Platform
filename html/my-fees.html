<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/my-fees.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-section">
        <a href="academics.html" class="back-btn">Back</a>
        <h1>School Fees & Payment History</h1>
        <p class="subtitle">
          Review your tuition fee structures and your official payment
          transaction history.
        </p>
      </div>

      <div
        class="toolbar"
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
          background-color: #ffffff;
          padding: 16px;
          border: 2px solid rgb(219, 215, 215);
          margin-bottom: 24px;
        "
      >

        <div
          class="filter-group"
          style="flex: 0 0 calc(50% - 6px); min-width: 0"
        >
          <select
            id="filterAcademicYear"
            class="form-control"
            style="width: 100%; padding: 8px 12px; border-radius: 6px"
          >
            <option value="">All Academic Years</option>
          </select>
        </div>

        <div
          class="filter-group"
          style="flex: 0 0 calc(50% - 6px); min-width: 0"
        >
          <select
            id="filterClass"
            class="form-control"
            style="width: 100%; padding: 8px 12px; border-radius: 6px"
          >
            <option value="">All Classes</option>
          </select>
        </div>

        <div class="filter-group" style="flex: 0 0 100%; min-width: 0">
          <select
            id="filterTerm"
            class="form-control"
            style="width: 100%; padding: 8px 12px; border-radius: 6px"
          >
            <option value="">All Semesters</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2>Fee Structures & Balances</h2>
        <div id="studentFeesContainer">
          <div class="empty-state">Loading your fee records...</div>
        </div>
      </div>

      <div class="card">
        <h2>Payment Transaction History</h2>
        <div id="paymentTransactionsContainer">
          <div class="empty-state">Loading your payment history...</div>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/transfer-history-index.js"></script>
    <script src="/js/my-fees.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
