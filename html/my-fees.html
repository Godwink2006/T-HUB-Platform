<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/my-fees.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-section">
        <a href="academics.html" class="back-btn">Back</a>
        <h1>School Fees & Payment History</h1>
        <p class="subtitle">
          Review your tuition fee structures and your official payment
          transaction history.
        </p>
      </div>

      <!-- Section 1: Fee Structures & Balances -->
      <div class="card">
        <h2>Fee Structures & Balances</h2>
        <div id="studentFeesContainer">
          <div class="empty-state">Loading your fee records...</div>
        </div>
      </div>

      <!-- Section 2: Payment Transactions & Receipts -->
      <div class="card">
        <h2>Payment Transaction History</h2>
        <div id="paymentTransactionsContainer">
          <div class="empty-state">Loading your payment history...</div>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/my-fees.js"></script>
  </body>
</html>
