<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/grades.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <main class="grades-main-content">
      <header class="topbar">
        <div>
          <h1>Grades</h1>
          <p>Manage grades.</p>

          <button
            onclick="window.location.href = 'academics.html'"
            class="back-grades-btn"
          >
            <i class="fa-solid fa-chevron-left"></i>
            Back
          </button>
        </div>

        <button id="addGrade" class="add-grades-btn">
          <i class="fa-solid fa-plus"></i>
          Enter Grades
        </button>
      </header>

      <section class="toolbar">
        <input
          type="text"
          id="gradeSearchInput"
          placeholder="Search grades..."
        />

        <select id="gradeToolbarClassSelect">
          <option value="">All Classes</option>
        </select>

        <select id="gradeToolbarSubjectSelect">
          <option value="">All Subjects</option>
        </select>

        <select id="gradeToolbarCategorySelect">
          <option value="">All Assessment Categories</option>
        </select>
      </section>

      <section class="grade-table-card">
        <table class="grades-table">
          <thead>
            <tr>
              <th>Assessment Category</th>
              <th>Class</th>
              <th>Subject</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="gradesTableBody"></tbody>
        </table>
      </section>
    </main>

    <div id="gradeModal" class="modal-grade">
      <div class="grade-modal-content">
        <div class="grade-modal-header">
          <h2>Enter Grades</h2>

          <button id="closeGradeModal">&times;</button>
        </div>
        <div class="grade-modal-body">
          <form id="gradeForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Class *</label>
                <select id="gradesClassSelect">
                  <option value="">Select Class</option>
                </select>
              </div>

              <div class="form-group">
                <label>Subject *</label>
                <select id="gradeSubjectSelect" disabled>
                  <option value="">Select Subject</option>
                </select>
              </div>

              <div class="form-group">
                <label>Assessment Category *</label>
                <select id="gradeAssessmentCategorySelect">
                  <option>Select Assessment</option>
                </select>
              </div>
            </div>

            <div class="grade-modal-footer">
              <button type="button" class="cancel-btn" id="cancelGradeModal">
                Cancel
              </button>

              <button type="button" class="save-btn" id="loadEnterGrade">
                Load Students
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- VIEW GRADE MODAL -->
    <div id="viewGradeModal" class="view-grade-modal">
      <div class="view-grade-modal-content">
        <div class="view-grade-modal-header">
          <h2>View Grades</h2>
          <button type="button" id="closeViewGradeModal">&times;</button>
        </div>

        <div class="view-grade-body">
          <div class="details-grid">
            <div class="details-item">
              <label>Class</label>
              <p id="viewModalClass"></p>
            </div>
            <div class="details-item">
              <label>Subject</label>
              <p id="viewModalSubject"></p>
            </div>
            <div class="details-item">
              <label>Assessment Category</label>
              <p id="viewModalAssessment"></p>
            </div>

            <div class="details-item">
              <label>Assessment Period</label>
              <p id="viewModalAssessmentPeriod"></p>
            </div>

            <div class="details-item">
              <label>Academic Year</label>
              <p id="viewModalAcademicYear"></p>
            </div>

            <div class="details-item">
              <label>Semester</label>
              <p id="viewModalSemester"></p>
            </div>

            <div class="details-item">
              <label>Date</label>
              <p id="viewModalDate"></p>
            </div>
          </div>

          <section class="grade-table-card">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Student</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody id="viewGradeTableBody">
                <!-- Dynamic rows loaded here -->
              </tbody>
            </table>
          </section>

          <div class="view-modal-footer">
            <button type="button" id="closeViewBtn" class="cancel-btn">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- EDIT GRADE MODAL -->
    <div id="editGradeModal" class="modal-editGrade" style="display: none">
      <div class="editGrade-modal-content">
        <div class="editGrade-modal-header">
          <h2>Edit Grades</h2>
          <button type="button" id="closeEditGradeModal">&times;</button>
        </div>

        <div class="editGrade-modal-body">
          <div class="details-grid">
            <div class="details-item">
              <label>Class</label>
              <p id="editModalClass"></p>
            </div>
            <div class="details-item">
              <label>Subject</label>
              <p id="editModalSubject"></p>
            </div>
            <div class="details-item">
              <label>Assessment Category</label>
              <p id="editModalAssessment"></p>
              <small
                id="editModalCategoryMax"
                style="color: #666; display: block"
              ></small>
            </div>

            <div class="details-item">
              <label>Assessment Period</label>
              <p id="editModalAssessmentPeriod"></p>
              <small
                id="editModalPeriodMax"
                style="color: #666; display: block"
              ></small>
            </div>

            <div class="details-item">
              <label>Effective Max Limit</label>
              <p
                id="editModalMaxMarks"
                style="font-weight: bold; color: #dc2626"
              ></p>
            </div>

            <div class="details-item">
              <label>Academic Year</label>
              <p id="editModalAcademicYear"></p>
            </div>

            <div class="details-item">
              <label>Semester</label>
              <p id="editModalSemester"></p>
            </div>

            <div class="details-item">
              <label>Date</label>
              <p id="editModalDate"></p>
            </div>
          </div>

          <form id="editGradeForm">
            <div class="form-grid">
              <div class="form-group" style="margin-bottom: 5px">
                <label>Status *</label>
                <select id="editModalStatusSelect">
                  <option value="drafted">Drafted</option>
                  <option value="submitted">Submitted</option>
                </select>
              </div>
            </div>

            <section class="editGrade-table-card">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th>
                    <th>Student</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody id="editGradeTableBody">
                  <!-- Dynamic input rows loaded here -->
                </tbody>
              </table>
            </section>

            <div class="editGrade-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditGradeModal"
              >
                Cancel
              </button>
              <button type="submit" class="save-btn">Update Grades</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="enterGradeModal" class="modal-enterGrade">
      <div class="enterGrade-modal-content">
        <div class="enterGrade-modal-header">
          <h2>Enter Grades</h2>
          <button id="closeEnterGradeModal">&times;</button>
        </div>

        <div class="enterGrade-modal-body">
          <!-- Summary Grid Displaying Academic Context -->
          <div class="details-grid">
            <div class="details-item">
              <label>Academic Year</label>
              <p id="enterGradeModalYear">-</p>
            </div>

            <div class="details-item">
              <label>Semester</label>
              <p id="enterGradeModalTerm">-</p>
            </div>

            <div class="details-item">
              <label>Class</label>
              <p id="enterGradeModalClass">-</p>
            </div>

            <div class="details-item">
              <label>Subject</label>
              <p id="enterGradeModalSubject">-</p>
            </div>

            <div class="details-item">
              <label>Assessment Category</label>
              <p id="enterGradeModalCategory">-</p>
            </div>

            <div class="details-item">
              <label>Assessment Period</label>
              <p id="enterGradeModalAssessmentPeriod"></p>
            </div>

            <div class="details-item">
              <label>Date</label>
              <p id="enterGradeModalDate">-</p>
            </div>
          </div>

          <form id="enterGradeForm">
            <div class="form-grid">
              <div class="form-group" style="margin-bottom: 15px">
                <label>Status *</label>
                <select id="gradeStatusSelect">
                  <option value="Drafted">Drafted</option>
                  <option value="Submitted">Submitted</option>
                </select>
              </div>
            </div>

            <section class="enterGrade-table-card">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th>
                    <th>Student</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody id="gradeRosterTableBody">
                  <!-- Dynamically populated roster rows -->
                </tbody>
              </table>
            </section>

            <div class="enterGrade-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEnterGradeModal"
              >
                Cancel
              </button>
              <button type="button" id="saveGradesBtn" class="save-btn">
                Save Grades
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/grades.js"></script>
  </body>
</html>
