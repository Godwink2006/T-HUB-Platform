<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>High School Management System</title>
    <link rel="stylesheet" href="/css/rooms.css">
    <link rel="preconnect" href="https://fontsgoogleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="room-container">

<main class="room-main-content">
<header class="topbar">
    <div>
        <h1>Rooms</h1>
        <p>Manage Rooms.</p>

      <button onclick="window.location.href='settings.html'"   class="back-rooms-btn">
        <i class="fa-solid fa-chevron-left"></i>
        Back
    </button>
    </div>

    <button id="addRoom" class="add-rooms-btn">
        <i class="fa-solid fa-plus"></i>
        Add Room
    </button>

</header>

<section class="toolbar">
    <input type="text" placeholder="Search rooms...">

   <select>
        <option>Room Type</option>
    </select>

    <select>
        <option>Status</option>
        <option>Active</option>
        <option>Inactive</option>
    </select>
</section>

<section class="rooms-table-card">
   <table>
    <thead>
        <tr>
                   <th>Room Name</th>
                   <th>Room Number</th>
                   <th>Room Type</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Computer Lab</td>
            <td>101</td>
            <td>Laboratory</td>
            <td></td>
           <td>
                <span class="rooms-status-active">Active</span>
            </td>

             <td>

                 <button class="rooms-actions-btn edit-Room">
                    <i class="fa-solid fa-pen"></i>
                </button>

                 <button class="rooms-actions-btn archive-Room">
                    <i class="fa-solid fa-box-archive"></i>
                </button>
            </td>
        </tr>

         <tr>
            <td>Science Lab</td>
            <td>102</td>
            <td>Laboratory</td>
            <td></td>
           <td>
                <span class="rooms-status-inactive">Inactive</span>
            </td>

             <td>

                 <button class="rooms-actions-btn edit-Room">
                    <i class="fa-solid fa-pen"></i>
                </button>

                 <button class="rooms-actions-btn archive-Room">
                    <i class="fa-solid fa-box-archive"></i>
                </button>
            </td>
        </tr>

    </tbody>
   </table>
</section>


</main>
    </div>





    <div id="roomModal" class="modal-room">
       <div class="room-modal-content">
        <div class="room-modal-header">
            <h2>Add Room</h2>

            <button id="closeRoomModal">&times;</button>
        </div>

        <div class="room-modal-body">

          <form id="roomForm">
            <div class="form-grid">

                 <div class="form-group">
                    <label>Room Name *</label>

                    <input type="text" placeholder="Enter room name">
                </div>

                   <div class="form-group">
                    <label>Room Number (Optional)</label>

                    <input type="text" placeholder="Optional">
                </div>

                  <div class="form-group">
                    <label>Room Type *</label>

                    <select>
                        <option>Select Room Type</option>
                    </select>
                </div>

                   <div class="form-group">
                    <label>Description (Optional)</label>

                    <input type="text" placeholder="Optional">
                </div>

                  <div class="form-group">
                    <label>Status *</label>

                    <select>
                        <option>Active</option>
                        <option>Archive</option>
                    </select>
                </div>

            </div>


            <div class="room-modal-footer">

<button type="button" class="cancel-btn" id="cancelRoomModal">
    Cancel
</button>

<button type="submit" class="save-btn">
    Save
</button>

            </div>
          </form>

        </div>
       </div>
    </div>





<!---Edit class modal-->


     <div id="editRoomModal" class="edit-modal-room">
       <div class="edit-room-modal-content">
        <div class="edit-room-modal-header">
            <h2>Edit Room</h2>

            <button id="closeEditRoomModal">&times;</button>
        </div>

        <div class="edit-room-modal-body">

          <form id="roomForm">
            <div class="form-grid">

                 <div class="form-group">
                    <label>Room Name *</label>

                    <input type="text" placeholder="Enter room name">
                </div>

                   <div class="form-group">
                    <label>Room Number (Optional)</label>

                    <input type="text" placeholder="Optional">
                </div>

                   <div class="form-group">
                    <label>Room Type *</label>

                    <select>
                        <option>Select Room Type</option>
                    </select>
                </div>

                   <div class="form-group">
                    <label>Description (Optional)</label>

                    <input type="text" placeholder="Optional">
                </div>

                  <div class="form-group">
                    <label>Status *</label>

                    <select>
                        <option>Active</option>
                        <option>Archive</option>
                    </select>
                </div>

            </div>

            <div class="edit-room-modal-footer">

<button type="button" class="cancel-btn" id="cancelEditRoomModal">
    Cancel
</button>

<button type="submit" class="edit-btn">
     Update Room
</button>

            </div>
          </form>

        </div>
       </div>
    </div>


<div id="archiveRoomModal" class="archive-modal"> 
    <div class="confirm-modal">
        <div confirm-icon>
            <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Room</h2>

        <p>
            Are you sure you want to archive this Room?
            Archived rooms cannot be assigned to classes or timetables.
        </p>

        <div class="archive-modal-footer">


<button id="cancelArchive" class="cancel-btn">
    Cancel
</button>

<button id="confirmArchive" class="archive-confirm-btn">
    Archive
</button>

        </div>
    </div>
</div>


<script src="/js/utils.js"></script>
    <script src="/js/rooms.js"></script>
</body>
</html>
