<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/academic-settings.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="academic-settings-container">
      <main class="academic-main-content">
        <header class="topbar">
          <div>
            <button
              onclick="window.location.href = 'settings.html'"
              class="back-academic-settings-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>

            <p>Terms.</p>
          </div>

          <button id="addTerm" class="add-terms-btn">
            <i class="fa-solid fa-plus"></i>
            Add Term
          </button>
        </header>
        <section class="terms-table-card">
          <table>
            <thead>
              <tr>
                <th>Term</th>
                <th>Academic Year</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Term 1</td>
                <td>2026-2027</td>
                <td>
                  <span class="terms-status-active">Active</span>
                </td>

                <td>
                  <button class="terms-actions-btn edit-term">
                    <i class="fa-solid fa-pen"></i>
                  </button>

                  <button class="terms-actions-btn archive-term">
                    <i class="fa-solid fa-box-archive"></i>
                  </button>
                </td>
              </tr>

              <tr>
                <td>Term 2</td>
                <td>2026-2027</td>
                <td>
                  <span class="terms-status-inactive">Active</span>
                </td>

                <td>
                  <button class="terms-actions-btn edit-term">
                    <i class="fa-solid fa-pen"></i>
                  </button>

                  <button class="terms-actions-btn archive-term">
                    <i class="fa-solid fa-box-archive"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="termModal" class="modal-terms">
      <div class="terms-modal-content">
        <div class="terms-modal-header">
          <h2>Add Term</h2>

          <button id="closeTermModal">&times;</button>
        </div>

        <div class="terms-modal-body">
          <form id="termForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>

                <select>
                  <option>2026/2027</option>
                </select>
              </div>

              <div class="form-group">
                <label>Term Name *</label>

                <input type="text" placeholder="Enter term name" />
              </div>

              <div class="form-group">
                <label>Start Date *</label>

                <input type="date" />
              </div>

              <div class="form-group">
                <label>End Date *</label>

                <input type="date" />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select>
                  <option>Active</option>
                  <option>Archive</option>
                </select>
              </div>
            </div>

            <div class="terms-modal-footer">
              <button type="button" class="cancel-btn" id="cancelTermModal">
                Cancel
              </button>

              <button type="submit" class="save-btn">Save Term</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!---Edit class modal-->

    <div id="editTermModal" class="edit-modal-terms">
      <div class="edit-terms-modal-content">
        <div class="edit-terms-modal-header">
          <h2>Edit Term</h2>

          <button id="closeEditTermModal">&times;</button>
        </div>

        <div class="edit-terms-modal-body">
          <form id="termForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>

                <select>
                  <option>2026/2027</option>
                </select>
              </div>

              <div class="form-group">
                <label>Term Name *</label>

                <input type="text" placeholder="Enter term name" />
              </div>

              <div class="form-group">
                <label>Start Date *</label>

                <input type="date" />
              </div>

              <div class="form-group">
                <label>End Date *</label>

                <input type="date" />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select>
                  <option>Active</option>
                  <option>Archived</option>
                </select>
              </div>
            </div>

            <div class="edit-terms-modal-footer">
              <button type="button" class="cancel-btn" id="cancelEditTermModal">
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update Term</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveTermModal" class="archive-modal">
      <div class="confirm-modal">
        <div confirm-icon>
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Term</h2>

        <p>
          Are you sure you want to archive this Term? Archived terms cannot be
          used for new academic records.
        </p>

        <div class="archive-modal-footer">
          <button id="cancelTermArchive" class="cancel-btn">Cancel</button>

          <button id="confirmArchive" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/semester.js"></script>
  </body>
</html>
