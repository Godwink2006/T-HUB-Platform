<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/academic-settings.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="academic-settings-container">
      <main class="academic-main-content">
        <header class="topbar">
          <div>
            <h2>Semesters.</h2>
            <button
              onclick="window.location.href = 'settings.html'"
              class="back-academic-settings-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addTerm" class="add-terms-btn">
            <i class="fa-solid fa-plus"></i>
            Add Semester
          </button>
        </header>
        <section class="terms-table-card">
          <table>
            <thead>
              <tr>
                <th>Semester</th>
                <th>Academic Year</th>
                <th>Status</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="termModal" class="modal-terms">
      <div class="terms-modal-content">
        <div class="terms-modal-header">
          <h2>Add Semester</h2>

          <button id="closeTermModal">&times;</button>
        </div>

        <div class="terms-modal-body">
          <form id="termForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>

                <select id="addAcademicYearSelect">
                  <option value="">Loading active years...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Semester Name *</label>

                <select id="addSemesterNameSelect">
                  <option>1st Semester</option>
                  <option>2nd Semester</option>
                </select>
              </div>

              <div class="form-group">
                <label>Start Date *</label>

                <input type="date" id="addStartDate" />
              </div>

              <div class="form-group">
                <label>End Date *</label>

                <input type="date" id="addEndDate" />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="addStatusSelect">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="terms-modal-footer">
              <button type="button" class="cancel-btn" id="cancelTermModal">
                Cancel
              </button>

              <button type="submit" class="save-btn">Save Semester</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!---Edit class modal-->

    <div id="editTermModal" class="edit-modal-terms">
      <div class="edit-terms-modal-content">
        <div class="edit-terms-modal-header">
          <h2>Edit Semester</h2>

          <button id="closeEditTermModal">&times;</button>
        </div>

        <div class="edit-terms-modal-body">
          <form id="editTermForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Academic Year *</label>

                <select id="editAcademicYearSelect">
                  <option value="">Loading active years...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Semester Name *</label>

                <select id="editSemesterNameSelect">
                  <option>1st Semester</option>
                  <option>2nd Semester</option>
                </select>
              </div>

              <div class="form-group">
                <label>Start Date *</label>

                <input type="date" id="editStartDate" />
              </div>

              <div class="form-group">
                <label>End Date *</label>

                <input type="date" id="editEndDate" />
              </div>

              <div class="form-group">
                <label>Status *</label>

                <select id="editStatusSelect">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="edit-terms-modal-footer">
              <button type="button" class="cancel-btn" id="cancelEditTermModal">
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveTermModal" class="archive-modal">
      <div class="confirm-modal">
        <div class="confirm-icon">
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Semester</h2>

        <p>
          Are you sure you want to archive
          <strong id="archiveTermName" style="color: green;">this Semester</strong>? Archived
          semesters cannot be used for new academic records.
        </p>

        <div class="archive-modal-footer">
          <button id="cancelTermArchive" class="cancel-btn">Cancel</button>

          <button id="confirmArchive" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/semester.js"></script>
  </body>
</html>
