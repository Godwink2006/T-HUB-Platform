<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/audit-logs.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="audit-log-container">
      <main class="audit-log-main-content">
        <header class="topbar">
          <div>
            <h1>Audit Logs</h1>
            <p>View audit logs.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-audit-logs-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>
        </header>

        <section class="toolbar">
          <input type="text" placeholder="Search audit logs..." />

          <select>
            <option>User</option>
          </select>

          <select>
            <option>Module</option>
          </select>

          <select>
            <option>Action</option>
            <option>Create</option>
            <option>Update</option>
          </select>

          <select>
            <option>Date</option>
          </select>
        </section>

        <section class="audit-logs-table-card">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>User</th>
                <th>Module</th>
                <th>Actions</th>
                <th>Description</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>01 Aug 2026</td>
                <td>John Doe</td>
                <td>Students</td>
                <td>Create</td>

                <td>Created student ST-0001</td>
              </tr>

              <tr>
                <td>01 Aug 2026</td>
                <td>Mary Smith</td>
                <td>Finance</td>
                <td>Payment</td>

                <td>Recorded payment for ST-0001</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="/js/utils.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
