<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/audit-logs.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="audit-log-container">
      <main class="audit-log-main-content">
        <header class="topbar">
          <div>
            <h1>Audit Logs</h1>
            <p>Review recorded changes made in your school.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-audit-logs-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>
        </header>

        <section class="toolbar">
          <label class="audit-filter">
            <span>Search description</span>
            <input
              id="auditSearchInput"
              type="search"
              placeholder="Search descriptions..."
            />
          </label>

          <label class="audit-filter">
            <span>User</span>
            <input
              id="auditUserInput"
              type="search"
              placeholder="Filter by user name..."
            />
          </label>

          <label class="audit-filter">
            <span>Module</span>
            <select id="auditModuleFilter">
              <option value="">All modules</option>
              <option value="Accounts">Accounts</option>
              <option value="School Settings">Schools</option>
              <option value="Academics">Academics</option>
              <option value="Announcements">Announcements</option>
              <option value="Assessments">Assessments</option>
              <option value="Students">Students</option>
              <option value="Enrollment">Enrollment</option>
              <option value="Grades">Grades</option>
              <option value="Attendance">Attendance</option>
              <option value="Finance">Finance</option>
              <option value="Library">Library</option>
              <option value="Notifications">Notifications</option>
              <option value="Parents">Parents</option>
              <option value="Staff">Staff</option>
              <option value="Transfers">Transfers</option>
              <option value="Timetable">Timetable</option>
              <option value="Billing">Billing</option>
            </select>
          </label>

          <label class="audit-filter">
            <span>Action</span>
            <select id="auditActionFilter">
              <option value="">All actions</option>
              <option value="INSERT">Create</option>
              <option value="UPDATE">Update</option>
              <option value="DELETE">Delete</option>
              <option value="PROMOTE">Promote</option>
              <option value="TRANSFER">Transfer</option>
              <option value="PAYMENT">Payment</option>
            </select>
          </label>

          <label class="audit-filter">
            <span>From</span>
            <input id="auditDateFrom" type="date" />
          </label>

          <label class="audit-filter">
            <span>To</span>
            <input id="auditDateTo" type="date" />
          </label>

          <button id="clearAuditFilters" class="audit-clear-btn" type="button">
            Clear filters
          </button>
        </section>

        <section class="audit-logs-table-card">
          <div class="audit-table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>User</th>
                  <th>Module</th>
                  <th>Actions</th>
                  <th>Description</th>
                </tr>
              </thead>

              <tbody id="auditLogsTableBody">
                <tr>
                  <td colspan="5" class="audit-table-message">
                    Loading audit logs...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <footer class="audit-pagination">
            <label for="auditPageSize">Rows per page</label>
            <select id="auditPageSize">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span id="auditPageSummary" aria-live="polite">Loading…</span>
            <div class="audit-page-buttons">
              <button
                id="auditPreviousPage"
                type="button"
                aria-label="Previous page"
              >
                Previous
              </button>
              <button id="auditNextPage" type="button" aria-label="Next page">
                Next
              </button>
            </div>
          </footer>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/audit-logs.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
