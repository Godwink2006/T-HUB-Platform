<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/subjects.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="subjects-container">
      <main class="subjects-main-content">
        <header class="topbar">
          <div>
            <h1>Subjects</h1>
            <p>Manage all subjects.</p>

            <button
              onclick="window.location.href = 'settings.html'"
              class="back-academic-settings-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addSubject" class="add-subjects-btn">
            <i class="fa-solid fa-plus"></i>
            Add Subject
          </button>
        </header>

        <section class="toolbar">
          <input
            type="text"
            id="searchSubjectInput"
            placeholder="Search subjects..."
          />

          <select id="filterDepartmentSelect">
            <option value="">All Departments</option>
          </select>

          <select id="filterStatusSelect">
            <option value="" selected>All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </section>

        <section class="subjects-table-card">
          <table>
            <thead>
              <tr>
                <th>Subject</th>
                <th>Department</th>
                <th>Description</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="subjectsTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="subjectModal" class="modal-subject">
      <div class="subject-modal-content">
        <div class="subject-modal-header">
          <h2 id="modalTitle">Add Subject</h2>

          <button id="closeSubjectModal">&times;</button>
        </div>

        <div class="subject-modal-body">
          <form id="subjectForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="subjectNameInput">Subject Name *</label>

                <input
                  id="subjectNameInput"
                  type="text"
                  placeholder="Enter subject name"
                />
              </div>

              <div class="form-group">
                <label for="departmentSelect">Department (Optional)</label>

                <select id="departmentSelect">
                  <option value="">Select department</option>
                </select>
              </div>

              <div class="form-group">
                <label for="statusSelect">Status *</label>

                <select id="statusSelect">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="descriptionInput">Description (Optional)</label>

                <textarea
                  id="descriptionInput"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="subject-modal-footer">
              <button type="button" class="cancel-btn" id="cancelSubjectModal">
                Cancel
              </button>

              <button type="submit" class="save-btn" id="saveSubjectBtn">
                Save Subject
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="editSubjectModal" class="edit-modal-subject">
      <div class="edit-subject-modal-content">
        <div class="edit-subject-modal-header">
          <h2>Edit Subject</h2>
          <button id="closeEditSubjectModal">&times;</button>
        </div>

        <div class="edit-subject-modal-body">
          <form id="editSubjectForm">
            <input type="hidden" id="editSubjectId" />

            <div class="form-grid">
              <div class="form-group">
                <label for="editSubjectNameInput">Subject Name *</label>
                <input
                  type="text"
                  id="editSubjectNameInput"
                  placeholder="Enter subject name"
                />
              </div>

              <div class="form-group">
                <label for="editDepartmentSelect">Department (Optional)</label>
                <select id="editDepartmentSelect">
                  <option value="">Select department</option>
                </select>
              </div>

              <div class="form-group">
                <label for="editStatusSelect">Status *</label>
                <select id="editStatusSelect">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="editDescriptionInput">Description (Optional)</label>
                <textarea
                  id="editDescriptionInput"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="edit-subject-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditSubjectModal"
              >
                Cancel
              </button>
              <button type="submit" class="edit-btn" id="updateSubjectBtn">
                Update Subject
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveSubjectModal" class="archive-modal">
      <div class="confirm-modal">
        <div class="confirm-icon">
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Subject</h2>

        <p id="archiveModalText"></p>

        <div class="archive-modal-footer">
          <button id="cancelArchiveModal" class="cancel-btn">Cancel</button>

          <button id="confirmArchiveBtn" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/subjects.js"></script>
  </body>
</html>
