<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Student records | T-HUB Family Portal</title>
    <link rel="stylesheet" href="/css/parent-portal.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body class="parent-portal">
    <header class="parent-topbar">
      <a class="parent-brand"
        ><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i
        ><span>HSMS <small>Family Portal</small></span></a
      >
      <button id="parentSignOut" class="parent-signout" type="button">
        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        Sign out
      </button>
    </header>
    <main class="parent-main parent-records-main">
      <section class="parent-welcome">
        <a class="parent-back-link" href="parent-dashboard.html"
          ><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> All
          students</a
        >
        <p class="parent-eyebrow">Selected student</p>
        <div class="record-student-heading">
          <span
            id="recordStudentPhoto"
            class="parent-student-avatar-shell parent-student-avatar-large"
            aria-hidden="true"
          >
            <img class="parent-student-avatar" alt="" />
            <span class="parent-student-avatar-initials"></span>
          </span>
          <div>
            <h1 id="recordStudentName">Loading student…</h1>
            <p id="recordStudentDetails">
              Checking your secure student selection…
            </p>
          </div>
        </div>
      </section>
      <nav class="parent-record-tabs" aria-label="Student record pages">
        <a href="parent-records.html?view=fees" data-record-view="fees"
          ><i class="fa-solid fa-file-invoice-dollar" aria-hidden="true"></i>
          Fees & payments</a
        >
        <a
          href="parent-records.html?view=attendance"
          data-record-view="attendance"
          ><i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
          Attendance</a
        >
        <a href="parent-records.html?view=grades" data-record-view="grades"
          ><i class="fa-solid fa-chart-column" aria-hidden="true"></i> Grades</a
        >

        <a
          href="parent-records.html?view=timetable"
          data-record-view="timetable"
          ><i class="fa-solid fa-calendar-alt" aria-hidden="true"></i>
          Timetable</a
        >
      </nav>
      <section class="parent-record-panel">
        <div class="parent-record-heading">
          <div>
            <p class="parent-eyebrow">Student records</p>
            <h2 id="recordViewTitle">Loading records…</h2>
          </div>
        </div>
        <div id="recordFilters" class="parent-record-filters" hidden>
          <label id="recordSchoolFilterField"
            >School<select id="recordSchoolFilter">
              <option value="">All schools</option>
            </select></label
          >
          <label id="recordYearFilterField"
            >Academic year<select id="recordYearFilter">
              <option value="">All academic years</option>
            </select></label
          >
          <label id="recordClassFilterField"
            >Class<select id="recordClassFilter">
              <option value="">All classes</option>
            </select></label
          >
          <label id="recordTermFilterField"
            >Semester<select id="recordTermFilter">
              <option value="">All semesters</option>
              <option value="1">1st Semester</option>
              <option value="2">2nd Semester</option>
            </select></label
          >
          <label id="recordPeriodFilterField" hidden
            >Period<select id="recordPeriodFilter">
              <option value="">All periods</option>
            </select></label
          >
          <label id="recordSubjectFilterField" hidden
            >Subject<select id="recordSubjectFilter">
              <option value="">All subjects</option>
            </select></label
          >
          <label id="recordDayFilterField" hidden
            >Day<select id="recordDayFilter">
              <option value="">All days</option>
            </select></label
          >
          <div class="parent-record-filter-actions">
            <button id="applyParentRecordFilters" type="button" class="parent-record-filter-button">
              <i class="fa-solid fa-filter" aria-hidden="true"></i>
              View records
            </button>
          </div>
        </div>
        <div
          id="parentRecordsContent"
          class="parent-record-content"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="parent-state">Loading the selected student's records…</p>
        </div>
      </section>
    </main>
    <dialog
      id="parentSignOutDialog"
      class="parent-signout-dialog"
      aria-labelledby="parentSignOutTitle"
      aria-describedby="parentSignOutDescription"
    >
      <div class="parent-signout-dialog-content">
        <span class="parent-signout-dialog-icon" aria-hidden="true">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </span>
        <h2 id="parentSignOutTitle">Sign out?</h2>
        <p id="parentSignOutDescription">Are you sure you want to sign out of the Family Portal?</p>
        <p id="parentSignOutMessage" class="parent-signout-dialog-message" aria-live="polite"></p>
        <div class="parent-signout-dialog-actions">
          <button id="cancelParentSignOut" class="parent-signout-cancel" type="button">Stay signed in</button>
          <button id="confirmParentSignOut" class="parent-signout-confirm" type="button">Sign out</button>
        </div>
      </div>
    </dialog>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"
      crossorigin="anonymous"
    ></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/parent-portal.js"></script>
    <script src="/js/parent-records.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
