<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/classes.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="classes-container">
      <main class="classes-main-content">
        <header class="topbar">
          <div>
            <h1>Classes</h1>
            <p>Manage all classes.</p>

            <button
              onclick="window.location.href = 'academics.html'"
              class="back-academics-btn"
            >
              <i class="fa-solid fa-chevron-left"></i>
              Back
            </button>
          </div>

          <button id="addClass" class="add-classes-btn">
            <i class="fa-solid fa-plus"></i>
            Add Class
          </button>
        </header>

        <section class="toolbar">
          <input
            type="text"
            id="classSearchInput"
            placeholder="Search classes..."
          />

          <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </section>

        <section class="classes-table-card">
          <table>
            <thead>
              <tr>
                <th>Class</th>
                <th>School Level</th>
                <th>Capacity</th>
                <th>Status</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="classesTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div id="classModal" class="modal-class">
      <div class="class-modal-content">
        <div class="class-modal-header">
          <h2>Add Class</h2>

          <button id="closeClassModal">&times;</button>
        </div>

        <div class="class-modal-body">
          <form id="classForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="className">Class Name *</label>
                <input
                  type="text"
                  id="className"
                  placeholder="e.g. Grade 10A"
                  required
                />
              </div>

              <div class="form-group">
                <label for="schoolLevel">School Level *</label>
                <select id="schoolLevel" required>
                  <option value="">Select School Level</option>
                  <option value="nursery">Nursery</option>
                  <option value="junior_primary">Junior Primary</option>
                  <option value="senior_primary">Senior Primary</option>
                  <option value="junior_secondary">Junior Secondary</option>
                  <option value="senior_secondary">Senior Secondary</option>
                </select>
              </div>

              <div class="form-group">
                <label for="capacity">Capacity *</label>
                <input
                  type="number"
                  id="capacity"
                  placeholder="Enter capacity"
                  required
                />
              </div>

              <div class="form-group">
                <label for="status">Status *</label>
                <select id="status" required>
                  <option value="inactive" selected>Inactive</option>
                  <option value="active">Active</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="description">Description (Optional)</label>
                <textarea
                  id="description"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="class-modal-footer">
              <button type="button" class="cancel-btn" id="cancelClassModal">
                Cancel
              </button>

              <button type="submit" class="save-btn">Save Class</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!---Edit class modal-->

    <div id="editClassModal" class="edit-modal-class">
      <div class="edit-class-modal-content">
        <div class="edit-class-modal-header">
          <h2>Edit Class</h2>

          <button id="closeEditClassModal">&times;</button>
        </div>

        <div class="edit-class-modal-body">
          <form id="editClassForm">
            <!-- Hidden input to track class ID -->
            <input type="hidden" id="editClassId" />

            <div class="form-grid">
              <div class="form-group">
                <label for="editClassName">Class Name *</label>
                <input
                  type="text"
                  id="editClassName"
                  placeholder="e.g. Grade 10A"
                  required
                />
              </div>

              <div class="form-group">
                <label for="editSchoolLevel">School Level *</label>
                <select id="editSchoolLevel" required>
                  <option value="">Select School Level</option>
                  <option value="nursery">Nursery</option>
                  <option value="junior_primary">Junior Primary</option>
                  <option value="senior_primary">Senior Primary</option>
                  <option value="junior_secondary">Junior Secondary</option>
                  <option value="senior_secondary">Senior Secondary</option>
                </select>
              </div>

              <div class="form-group">
                <label for="editCapacity">Capacity *</label>
                <input
                  type="number"
                  id="editCapacity"
                  placeholder="Enter capacity"
                  required
                />
              </div>

              <div class="form-group">
                <label for="editStatus">Status *</label>
                <select id="editStatus" required>
                  <option value="inactive">Inactive</option>
                  <option value="active">Active</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="editDescription">Description (Optional)</label>
                <textarea
                  id="editDescription"
                  rows="4"
                  placeholder="Write description"
                ></textarea>
              </div>
            </div>

            <div class="edit-class-modal-footer">
              <button
                type="button"
                class="cancel-btn"
                id="cancelEditClassModal"
              >
                Cancel
              </button>

              <button type="submit" class="edit-btn">Update Class</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="archiveClassModal" class="archive-modal">
      <div class="confirm-modal">
        <div confirm-icon>
          <i class="fa-solid fa-box-archive"></i>
        </div>

        <h2>Archive Class</h2>

        <p>Are you sure you want to archive this class?</p>

        <div class="archive-modal-footer">
          <button id="cancelArchive" class="cancel-btn">Cancel</button>

          <button id="confirmArchive" class="archive-confirm-btn">
            Archive
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/classes.js"></script>
  </body>
</html>
