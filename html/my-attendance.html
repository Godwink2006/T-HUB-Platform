<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Attendance</title>
    <link rel="stylesheet" href="/css/my-attendance.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div>
          <button class="back-academics-btn" onclick="history.back()">
            Back
          </button>
          <h1>My Attendance</h1>
          <p>Track your class attendance and attendance rates for this year.</p>
        </div>

        <div
          class="toolbar"
          style="
            background-color: #ffffff;
            padding: 12px;
            border: 2px solid rgb(219, 215, 215);
            margin-bottom: 24px;
          "
        >
          <div
            class="filters-container"
            style="display: flex; flex-wrap: wrap; gap: 8px"
          >

            <select
              id="academicYearFilter"
              style="
                flex: 0 0 calc(50% - 4px);
                width: calc(50% - 4px);
                box-sizing: border-box;
                padding: 8px 6px;
                font-size: 0.75rem;
                cursor: pointer;
              "
            >
              <option value="all">All Academic Years</option>
            </select>

            <select
              id="termFilter"
              style="
                flex: 0 0 calc(50% - 4px);
                width: calc(50% - 4px);
                box-sizing: border-box;
                padding: 8px 6px;
                font-size: 0.75rem;
                cursor: pointer;
              "
            >
              <option value="all">All Semesters</option>
            </select>


            <select
              id="classFilter"
              style="
                flex: 0 0 calc(50% - 4px);
                width: calc(50% - 4px);
                box-sizing: border-box;
                padding: 8px 6px;
                font-size: 0.75rem;
                cursor: pointer;
              "
            >
              <option value="all">All Classes</option>
            </select>

            <select
              id="subjectFilter"
              style="
                flex: 0 0 calc(50% - 4px);
                width: calc(50% - 4px);
                box-sizing: border-box;
                padding: 8px 6px;
                font-size: 0.75rem;
                cursor: pointer;
              "
            >
              <option value="all">All Subjects</option>
            </select>


            <select
              id="statusFilter"
              style="
                flex: 0 0 100%;
                width: 100%;
                box-sizing: border-box;
                padding: 8px 6px;
                font-size: 0.75rem;
                cursor: pointer;
              "
            >
              <option value="all">All Status</option>
              <option value="present">Present</option>
              <option value="absent">Absent</option>
            </select>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Overall Rate</span>
            <div class="stat-value text-green" id="overallRate">0%</div>
            <span class="stat-sub">Total</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Present</span>
            <div class="stat-value text-green" id="totalPresent">0</div>
            <span class="stat-sub">Total Classes</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Absent</span>
            <div class="stat-value text-red" id="totalAbsent">0</div>
            <span class="stat-sub">Total Classes</span>
          </div>
        </div>

        <h2 class="section-title">Subject Summary</h2>
        <div class="subject-cards-grid" id="subjectCardsContainer"></div>
      </div>

      <div class="history-card">
        <div class="card-header">
          <h3>Attendance History</h3>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Subject</th>
                <th>Teacher</th>
                <th>Period</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="attendanceHistoryTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/transfer-history-index.js"></script>
    <script src="/js/my-attendance.js"></script>
  </body>
</html>
