<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>High School Management System</title>
    <link rel="stylesheet" href="/css/class-report.css">
    <link rel="preconnect" href="https://fontsgoogleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="classes-report-container">

<main class="classes-report-main-content">
<header class="topbar">
    <div>
        <h1>Class Reports</h1>
        <p>View class reports.</p>

         <button onclick="window.location.href='reports.html'"   class="back-classes-report-btn">
        <i class="fa-solid fa-chevron-left"></i>
        Back
    </button>
    </div>

</header>

<section class="toolbar">

   <select>
        <option>All Status</option>
        <option>Active</option>
        <option>Inactive</option>
    </select>

   <select>
        <option>Academic Year</option>
        <option>2026-2027</option>
        <option>2025-2026</option>
        <option>2024-2025</option>
    </select>

    </section>

<section class="classes-report-table-card">
   <table>
    <thead>
        <tr>
            <th>Total Classes</th>
             <th>Inactive Classes</th>
              <th>Active Classes</th>
              <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>20</td>
            <td>10</td>
            <td>10</td>

             <td>
                <button class="classes-report-actions-btn save-btn">
                    Print Report
                </button>

               <button class="classes-report-actions-btn save-btn">
                    Export PDF
                </button>

                 <button class="classes-report-actions-btn save-btn">
                    Export Excel
                </button>

            </td>
        </tr>


    </tbody>
   </table>
</section>
</main>

    </div>


<script src="/js/utils.js"></script>
</body>
</html>
