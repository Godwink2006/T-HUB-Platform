<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="login-container">
      <div class="Left-panel">
        <div class="logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="256"
            height="256"
          >
            <circle cx="256" cy="256" r="240" fill="#2563EB" />

            <rect
              x="156"
              y="190"
              width="200"
              height="170"
              rx="8"
              fill="#FFFFFF"
            />
            <polygon points="256,130 130,200 382,200" fill="#FBBF24" />

            <rect x="236" y="285" width="40" height="75" fill="#2563EB" />

            <rect x="180" y="220" width="30" height="30" fill="#DBEAFE" />
            <rect x="230" y="220" width="30" height="30" fill="#DBEAFE" />
            <rect x="280" y="220" width="30" height="30" fill="#DBEAFE" />
            <rect x="330" y="220" width="30" height="30" fill="#DBEAFE" />

            <polygon points="256,80 170,115 256,150 342,115" fill="#111827" />
            <rect x="235" y="145" width="42" height="8" fill="#111827" />
            <line
              x1="342"
              y1="115"
              x2="342"
              y2="160"
              stroke="#111827"
              stroke-width="4"
            />
            <circle cx="342" cy="165" r="5" fill="#FBBF24" />

            <path
              d="M170 380
           Q210 360 256 380
           Q302 360 342 380
           L342 420
           Q302 400 256 420
           Q210 400 170 420 Z"
              fill="#FFFFFF"
            />
          </svg>
        </div>

        <h1>High School Management System</h1>
        <p>Manage</p>
        <p><i class="fa-solid fa-user-graduate"></i>Students</p>
        <p><i class="fa-solid fa-chalkboard-teacher"></i>Teachers</p>
        <p><i class="fa-solid fa-clipboard-check"></i>Attendance</p>
        <p><i class="fa-solid fa-file-lines"></i>Examinations</p>
        <p><i class="fa-solid fa-chart-line"></i>Finance</p>
        <p>And school records from one secure platform.</p>
      </div>

      <div class="right-panel">
        <div class="login-card">
          <h2>Welcome Back</h2>
          <p class="subtitle">sign in to continue.</p>

          <form id="loginForm">
            <div class="form-group">
              <label>Email Address *</label>

              <div class="input-box">
                <span class="icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M2 4h20v16H2V4zm2 2v.5l8 5.5 8-5.5V6H4zm16 12V9l-8 5.5L4 9v9h16z"
                    /></svg
                ></span>

                <input
                  id="email"
                  type="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>Password *</label>

              <div class="input-box">
                <span class="icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M17 8V7a5 5 0 0 0-10 0v1H5v13h14V8zm-8-1a3 3 0 0 1 6 0v1H9zm8 12H7v-9h10z"
                    /></svg
                ></span>

                <div class="password-field">
                  <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                  />

                  <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password')"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="options">
              <label class="remember">
                <input type="checkbox" />
                Remember Me (Optional)
              </label>

              <a href="#"> Forget Password </a>
            </div>

            <button class="login-btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
